name: Odak
options:
  bundleIdPrefix: app.odak
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Odak:
    type: application
    platform: macOS
    sources:
      - path: Odak
        excludes:
          - Resources/odak-block
      - path: Odak/Resources/odak-block
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Odak
        PRODUCT_BUNDLE_IDENTIFIER: app.odak.Odak
        INFOPLIST_FILE: Odak/Info.plist
        CODE_SIGN_ENTITLEMENTS: Odak/Odak.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  OdakTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OdakTests
    dependencies:
      - target: Odak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.odak.OdakTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Odak.app/Contents/MacOS/Odak"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Odak:
    build:
      targets:
        Odak: all
        OdakTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OdakTests
    archive:
      config: Release
